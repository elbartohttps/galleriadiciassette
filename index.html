<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERIA 17 | Indie Art Space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        /* COLORI LOGO */
        :root {
            --bg-rosa-logo: #F4D8E4; 
            --marrone-17: #674F35;    
            --nero-pieno: #000000;
            --bianco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-rosa-logo) !important;
            font-family: 'Archivo Black', sans-serif;
            color: var(--nero-pieno);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .logo-container img {
            max-width: 200px; 
            height: auto;
            margin-bottom: 10px;
        }

        /* TAGLINE STILE ETICHETTA */
        .tagline {
            font-size: 1.1rem;
            text-transform: uppercase;
            display: inline-block;
            background-color: var(--nero-pieno);
            color: var(--bg-rosa-logo);
            padding: 6px 15px;
            transform: rotate(-1.5deg);
            margin-bottom: 40px;
        }

        /* NAVIGAZIONE STILE FESTIVAL */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            font-family: 'Archivo Black', sans-serif;
            text-decoration: none;
            color: var(--nero-pieno);
            background: transparent;
            border: 3px solid var(--nero-pieno);
            padding: 10px 25px;
            font-size: 1.2rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
            position: relative;
        }

        /* Effetto hover: diventa pieno e si sposta come un tasto */
        nav a:hover {
            background: var(--ciano-17);
            color: var(--nero-pieno);
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--nero-pieno);
        }

        /* GRIGLIA OPERE */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .art-card {
            background: var(--bianco);
            padding: 12px;
            border: 3px solid var(--marrone-17);
            box-shadow: 10px 10px 0px var(--marrone-17);
            transition: all 0.3s ease;
        }

        .art-card:hover {
            box-shadow: 15px 15px 0px var(--ciano-17);
            transform: scale(1.02);
        }

        .art-card img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--marrone-17);
        }

        .art-details {
            margin-top: 15px;
            text-align: left;
        }

        .art-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .art-meta {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #555;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 60px 20px;
            border-top: 4px solid var(--marrone-17);
            background: rgba(0,0,0,0.03);
        }

        .social-links a {
            display: inline-block;
            background: var(--marrone-17);
            color: var(--bg-rosa-logo);
            text-decoration: none;
            padding: 10px 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .social-links a:hover {
            background: var(--nero-pieno);
            color: var(--bg-rosa-logo);
        }

        .copyright {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav { flex-direction: column; align-items: center; }
            nav a { width: 80%; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logoG17_2.png" alt="Galleria 17 Logo">
        </div>
        <div class="tagline">Creative Digital Space</div>
        
        <nav>
            <a href="#">Archivio</a>
            <a href="https://galleria-17.redbubble.com" target="_blank">Shop</a>
            <a href="#">Info</a>
        </nav>
    </header>

    <main class="gallery-container">
        
        <div class="art-card">
            <img src="quiet space.TIF" alt="Opera 1">
            <div class="art-details">
                <div class="art-title">quiet space</div>
                <div class="art-meta">Digital Illustration</div>
            </div>
        </div>

        <div class="art-card">
            <img src="45 minutes before dinner.TIF" alt="Opera 2">
            <div class="art-details">
                <div class="art-title">45 minutes before dinner</div>
                <div class="art-meta">Digital Illustration</div>
            </div>
        </div>

        <div class="art-card">
            <img src="theidentity 2.PNG" alt="Opera 3">
            <div class="art-details">
                <div class="art-title">the identity</div>
                <div class="art-meta">Digital Illustration</div>
            </div>
        </div>

    </main>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com/galleriadiciassette" target="_blank">INSTAGRAM</a>
        </div>
        <p class="copyright">Galleria Diciassette &copy; 2025 — Creative Digital Space</p>
    </footer>

</body>
</html>
